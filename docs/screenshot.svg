<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Sahi Number interface</title><desc id="desc">Mobile-first helpline check form beside an evidence-led result summary.</desc>
  <rect width="1200" height="720" fill="#f6f1e7"/><rect width="1200" height="70" fill="#fffdf7"/><path d="M0 70h1200" stroke="#c8c8bb"/>
  <rect x="42" y="18" width="36" height="36" rx="8" fill="#0d4d34"/><text x="60" y="42" text-anchor="middle" font-family="system-ui" font-size="12" font-weight="800" fill="white">SN</text><text x="92" y="43" font-family="system-ui" font-size="20" font-weight="800" fill="#17231d">Sahi Number</text>
  <text x="64" y="190" font-family="system-ui" font-size="72" font-weight="850" fill="#17231d">Check a</text><text x="64" y="263" font-family="system-ui" font-size="72" font-weight="850" fill="#17231d">helpline</text><text x="64" y="336" font-family="system-ui" font-size="72" font-weight="850" fill="#17231d">number</text>
  <text x="66" y="392" font-family="system-ui" font-size="22" fill="#536158">Compare every number Google showed</text><text x="66" y="424" font-family="system-ui" font-size="22" fill="#536158">with what the brand publishes.</text>
  <rect x="635" y="130" width="490" height="455" rx="16" fill="#fffdf7" filter="url(#s)"/><text x="675" y="180" font-family="system-ui" font-size="19" font-weight="800" fill="#176b48">Brand check</text><path d="M635 205h490M635 205h245" stroke="#176b48" stroke-width="4"/>
  <text x="680" y="250" font-family="system-ui" font-size="14" font-weight="750" fill="#17231d">Brand</text><rect x="680" y="266" width="400" height="58" rx="12" fill="white" stroke="#9da69f"/><text x="700" y="302" font-family="system-ui" font-size="17" font-weight="700" fill="#17231d">Example Air</text>
  <text x="680" y="365" font-family="system-ui" font-size="14" font-weight="750" fill="#17231d">City</text><rect x="680" y="381" width="190" height="58" rx="12" fill="white" stroke="#9da69f"/><text x="700" y="417" font-family="system-ui" font-size="16" fill="#17231d">Mumbai</text>
  <text x="890" y="365" font-family="system-ui" font-size="14" font-weight="750" fill="#17231d">Search language</text><rect x="890" y="381" width="190" height="58" rx="12" fill="white" stroke="#9da69f"/><text x="910" y="417" font-family="system-ui" font-size="16" fill="#17231d">English</text>
  <rect x="680" y="475" width="400" height="62" rx="12" fill="#176b48"/><text x="880" y="514" text-anchor="middle" font-family="system-ui" font-size="18" font-weight="800" fill="white">Run check</text>
  <circle cx="78" cy="555" r="24" fill="none" stroke="#176b48" stroke-width="3"/><path d="m66 555 8 8 16-18" fill="none" stroke="#176b48" stroke-width="4"/><text x="120" y="552" font-family="system-ui" font-size="25" font-weight="850" fill="#17231d">1800123456</text><text x="120" y="581" font-family="system-ui" font-size="14" font-weight="800" fill="#176b48">OFFICIAL_MATCH</text>
  <defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#17231d" flood-opacity=".12"/></filter></defs>
